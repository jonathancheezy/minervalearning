<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minerva Admin — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', system-ui, sans-serif; background: #F8FAFC; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; -webkit-font-smoothing: antialiased; }
    .login-card { background: #fff; border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; text-decoration: none; }
    .logo-mark { width: 36px; height: 36px; background: linear-gradient(135deg, #7C3AED, #8B5CF6); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .logo-text { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1.125rem; color: #0F172A; }
    .logo-text span { color: #7C3AED; }
    h2 { font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 700; color: #0F172A; margin-bottom: 6px; }
    .subtitle { color: #64748B; font-size: 0.9375rem; margin-bottom: 28px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.875rem; font-weight: 600; color: #0F172A; margin-bottom: 6px; }
    input { width: 100%; padding: 11px 14px; border: 1.5px solid #E2E8F0; border-radius: 8px; font-size: 0.9375rem; font-family: 'DM Sans', sans-serif; color: #0F172A; background: #fff; transition: border-color 0.2s, box-shadow 0.2s; outline: none; }
    input:focus { border-color: #7C3AED; box-shadow: 0 0 0 4px rgba(124,58,237,0.08); }
    .btn-login { width: 100%; padding: 12px; background: #7C3AED; color: #fff; border: none; border-radius: 8px; font-size: 0.9375rem; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; margin-top: 8px; transition: background 0.2s, transform 0.1s; }
    .btn-login:hover { background: #8B5CF6; transform: translateY(-1px); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .error-msg { background: rgba(239,68,68,0.08); color: #EF4444; padding: 10px 14px; border-radius: 8px; font-size: 0.875rem; margin-bottom: 16px; display: none; }
    .error-msg.show { display: block; }
    .back-link { display: block; text-align: center; margin-top: 20px; color: #64748B; font-size: 0.875rem; text-decoration: none; }
    .back-link:hover { color: #7C3AED; }
  </style>
</head>
<body>
  <div class="login-card">
    <a href="/" class="logo">
      <div class="logo-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
      <span class="logo-text">Minerva <span>Admin</span></span>
    </a>
    <h2>Sign in</h2>
    <p class="subtitle">Access the admin dashboard</p>
    <div class="error-msg" id="Error-msg">Incorrect email or password. Please try again.</div>
    <form id="login-form" autocomplete="off">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn-login" id="submit-btn">Sign in</button>
    </form>
    <a href="/" class="back-link">Back to site</a>
  </div>

  <script>
    const AUTH_BASE = 'https://minerva-auth.minerva-ai-learning.workers.dev';

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submit-btn');
      const err = document.getElementById('Error-msg');
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      err.classList.remove('show');

      try {
        const res = await fetch(AUTH_BASE + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!data.success || !data.token) {
          err.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Sign in';
          return;
        }

        sessionStorage.setItem('minerva_admin_token', data.token);
        sessionStorage.setItem('minerva_admin_email', data.email || 'admin@minerva.ai');
        window.location.href = '/admin_dashboard';
      } catch (e) {
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
