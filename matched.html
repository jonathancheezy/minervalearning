<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matched Assignments — Minerva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#7C3AED;--primary-dark:#6D28D9;--primary-light:#8B5CF6;--teal:#0EA5E9;--sky:#38BDF8;--dark:#0F172A;--dark-2:#1E293B;--surface:#F8FAFC;--surface-2:#F1F5F9;--white:#FFFFFF;--border:#E2E8F0;--text-muted:#64748B;--success:#10B981;--success-bg:rgba(16,185,129,0.1);--warning:#F59E0B;--warning-bg:rgba(245,158,11,0.1);--danger:#EF4444;--danger-bg:rgba(239,68,68,0.1);--radius:16px;--shadow:0 1px 3px rgba(0,0,0,0.06),0 4px 16px rgba(0,0,0,0.04);}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'DM Sans',system-ui,sans-serif;background:var(--surface);color:var(--dark);-webkit-font-smoothing:antialiased;min-height:100vh}
    h1,h2,h3,h4{font-family:'Outfit',sans-serif;letter-spacing:-0.02em}
    .header{background:var(--white);border-bottom:1px solid var(--border);padding:0 2rem;height:64px;display:flex;align-items:center;position:sticky;top:0;z-index:100;justify-content:space-between}
    .header-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
    .logo-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--primary),var(--primary-light));border-radius:8px;display:flex;align-items:center;justify-content:center}
    .logo-mark svg{width:18px;height:18px}
    .logo-text{font-family:'Outfit',sans-serif;font-weight:700;font-size:1.125rem;color:var(--dark)}
    .logo-text span{color:var(--primary)}
    .header-right{display:flex;align-items:center;gap:8px}
    .header-nav-link{font-size:0.8125rem;font-weight:500;color:var(--text-muted);text-decoration:none;padding:6px 12px;border-radius:8px;transition:all 0.15s;white-space:nowrap}
    .header-nav-link:hover{color:var(--primary);background:rgba(124,58,237,0.06)}
    .header-nav-link.active{color:var(--primary);background:rgba(124,58,237,0.1);font-weight:600}
    .layout{max-width:1280px;margin:0 auto;padding:2rem}
    .page-header{margin-bottom:2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
    .page-title{font-size:1.75rem;font-weight:800;color:var(--dark)}
    .page-subtitle{color:var(--text-muted);font-size:0.9375rem}
    .count-badge{background:linear-gradient(135deg,rgba(124,58,237,0.1),rgba(14,165,233,0.1));color:var(--primary);font-size:0.8125rem;font-weight:600;padding:4px 12px;border-radius:100px}
    .btn-back{background:var(--surface-2);border:1.5px solid var(--border);cursor:pointer;color:var(--dark-2);font-size:0.8125rem;font-weight:500;font-family:'DM Sans',sans-serif;padding:5px 12px;border-radius:8px;transition:all 0.15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
    .btn-back:hover{background:var(--border)}
    .card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden}
    .card-header{padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.75rem}
    .card-title{font-family:'Outfit',sans-serif;font-size:1rem;font-weight:700;color:var(--dark)}
    .search-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--border);border-radius:100px;padding:6px 14px}
    .search-box input{border:none;background:transparent;outline:none;font-size:0.8125rem;font-family:'DM Sans',sans-serif;color:var(--dark);width:180px}
    .search-box input::placeholder{color:var(--text-muted)}
    table{width:100%;border-collapse:collapse}
    thead th{padding:10px 1.25rem;text-align:left;font-size:0.75rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;background:var(--surface);border-bottom:1px solid var(--border)}
    tbody tr{border-bottom:1px solid var(--border);transition:background 0.1s}
    tbody tr:last-child{border-bottom:none}
    tbody tr:hover{background:rgba(124,58,237,0.02)}
    td{padding:14px 1.25rem;font-size:0.875rem;vertical-align:middle}
    .td-name{font-weight:600;color:var(--dark)}.td-email{color:var(--text-muted);font-size:0.8125rem}
    .td-role{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:100px;font-size:0.75rem;font-weight:600}
    .td-role.parent{background:rgba(14,165,233,0.1);color:#0284C7}.td-role.teacher{background:rgba(124,58,237,0.1);color:var(--primary)}
    .td-status.matched{background:linear-gradient(135deg,rgba(124,58,237,0.1),rgba(14,165,233,0.1));color:var(--primary)}
    .td-time{color:var(--text-muted);font-size:0.8125rem}
    .td-match{background:linear-gradient(135deg,rgba(124,58,237,0.05),rgba(14,165,233,0.05));border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:10px}
    .match-arrow{color:var(--primary);font-size:1rem}
    .btn-view{padding:5px 12px;background:rgba(124,58,237,0.08);color:var(--primary);border-radius:8px;font-size:0.75rem;font-weight:600;cursor:pointer;border:none;text-decoration:none;font-family:'DM Sans',sans-serif;transition:all 0.15s;display:inline-block}
    .btn-view:hover{background:rgba(124,58,237,0.15)}
    .no-data{text-align:center;padding:4rem 2rem}
    .no-data-icon{width:56px;height:56px;background:linear-gradient(135deg,rgba(124,58,237,0.08),rgba(14,165,233,0.08));border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem}
    .no-data h3{font-size:1rem;font-weight:700;margin-bottom:6px;color:var(--dark)}
    .no-data p{font-size:0.875rem;color:var(--text-muted)}
    .skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .skeleton-row td{padding:16px 1.25rem}
    .toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--dark);color:white;padding:10px 18px;border-radius:10px;font-size:0.875rem;font-weight:500;opacity:0;transition:opacity 0.2s;pointer-events:none;z-index:9999}
    .toast.show{opacity:1}
    .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.5);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity 0.2s}
    .modal-overlay.open{opacity:1;pointer-events:all}
    .modal{background:var(--white);border-radius:20px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,0.15);transform:scale(0.95) translateY(10px);transition:transform 0.2s}
    .modal-overlay.open .modal{transform:scale(1) translateY(0)}
    .modal-header{padding:1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .modal-title{font-family:'Outfit',sans-serif;font-size:1.125rem;font-weight:700;color:var(--dark)}
    .modal-close{background:var(--surface);border:none;width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:1.125rem;transition:background 0.15s}
    .modal-close:hover{background:var(--surface-2);color:var(--dark)}}
    .modal-body{padding:1.5rem}
    .modal-footer{padding:1.25rem 1.5rem;border-top:1px solid var(--border);display:flex;gap:0.75rem;justify-content:flex-end;flex-wrap:wrap}
    .btn-modal{padding:9px 20px;border-radius:10px;font-size:0.875rem;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all 0.15s}
    .btn-modal.close-btn{background:var(--surface-2);color:var(--dark-2)}
    .btn-modal.close-btn:hover{background:var(--border)}
    .detail-section{margin-bottom:1.25rem}.detail-section:last-child{margin-bottom:0}
    .detail-label{font-size:0.75rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px}
    .detail-value{font-size:0.9375rem;color:var(--dark);font-weight:500}
    .detail-value.multiline{white-space:pre-wrap;line-height:1.5}
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
    .detail-role-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:100px;font-size:0.8125rem;font-weight:600}
    .detail-role-badge.parent{background:rgba(14,165,233,0.1);color:#0284C7}.detail-role-badge.teacher{background:rgba(124,58,237,0.1);color:var(--primary)}}
    .detail-status-badge.matched{background:linear-gradient(135deg,rgba(124,58,237,0.1),rgba(14,165,233,0.1));color:var(--primary)}}
    .detail-divider{border:none;border-top:1px solid var(--border);margin:1.25rem 0}
    .subject-chip{display:inline-block;padding:2px 8px;background:rgba(124,58,237,0.08);color:var(--primary,#7c3aed);border-radius:100px;font-size:0.6875rem;font-weight:500;margin:2px;white-space:nowrap}
    .match-detail-card{background:linear-gradient(135deg,rgba(124,58,237,0.06),rgba(14,165,233,0.06));border-radius:12px;padding:16px;display:flex;align-items:center;gap:12px;margin-bottom:1rem}
    .match-detail-icon{width:40px;height:40px;background:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .match-detail-icon svg{width:20px;height:20px;color:white}
    .match-detail-info{flex:1}
    .match-detail-name{font-weight:700;color:var(--dark);font-size:0.9375rem}
    .match-detail-meta{font-size:0.8125rem;color:var(--text-muted)}
    .match-section-label{font-size:0.75rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px}

    .hamburger{background:none;border:none;cursor:pointer;padding:8px;display:none;flex-direction:column;gap:5px;border-radius:8px;transition:background 0.15s}
    .hamburger:hover{background:var(--surface-2)}
    .hamburger span{display:block;width:20px;height:2px;background:var(--dark);border-radius:2px;transition:all 0.2s}
    .hamburger.open span:nth-child(1){transform:rotate(45deg) translate(4px,4px)}
    .hamburger.open span:nth-child(2){opacity:0}
    .hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(4px,-4px)}
    .nav-dropdown{position:absolute;top:100%;right:0;background:var(--white);border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1);min-width:160px;padding:6px;z-index:200;display:none;flex-direction:column;gap:2px}
    .nav-dropdown.open{display:flex}
    .nav-dropdown a{font-size:0.875rem;font-weight:500;color:var(--dark);text-decoration:none;padding:8px 12px;border-radius:8px;transition:background 0.15s;white-space:nowrap}
    .nav-dropdown a:hover{background:rgba(124,58,237,0.06);color:var(--primary)}
    .nav-dropdown a.active{color:var(--primary);font-weight:600}
    .header-right{position:relative}
    @media(max-width:700px){.hamburger{display:flex}.header-nav-link:not(.hamburger){display:none}.nav-dropdown{left:0;right:auto;min-width:140px}}

  
    .header{background:var(--white);border-bottom:1px solid var(--border);padding:0 2rem;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;position:relative}
    .header-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
    .logo-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--primary),var(--primary-light));border-radius:8px;display:flex;align-items:center;justify-content:center}
    .logo-mark svg{width:18px;height:18px}
    .logo-text{font-family:'Outfit',sans-serif;font-weight:700;font-size:1.125rem;color:var(--dark)}
    .header-right{display:flex;align-items:center;gap:12px}
    .btn-logout{background:none;border:1.5px solid var(--border);cursor:pointer;color:var(--primary);font-size:0.8125rem;font-weight:500;font-family:'DM Sans',sans-serif;padding:5px 12px;border-radius:8px;transition:all 0.15s}
    .btn-logout:hover{border-color:var(--danger);color:var(--danger)}
    .nav-centered{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:4px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
    .nav-centered a{font-size:0.875rem;font-weight:500;color:var(--dark);text-decoration:none;padding:7px 14px;border-radius:8px;transition:background 0.15s;white-space:nowrap}
    .nav-centered a:hover{background:rgba(124,58,237,0.06);color:var(--primary)}
    .nav-centered a.active{color:var(--primary);font-weight:600}
    .lang-dropdown.show{display:block!important}
    .lang-option.active{color:var(--primary);font-weight:700}
    .lang-wrap{position:relative}
    .lang-btn{display:flex;align-items:center;gap:5px;padding:7px 10px;border:1.5px solid var(--border);border-radius:10px;background:#fff;font-size:0.8125rem;font-weight:600;color:var(--primary);cursor:pointer;font-family:'DM Sans',sans-serif}
    .lang-dropdown{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--border);border-radius:10px;padding:6px;display:none;z-index:200;min-width:80px;box-shadow:0 8px 24px rgba(0,0,0,0.08)}
    .lang-option{display:block;width:100%;padding:7px 10px;border:none;background:none;border-radius:6px;font-size:0.8125rem;font-weight:600;color:var(--primary);cursor:pointer;text-align:left}
    .lang-option:hover{background:rgba(124,58,237,0.06)}

</style>
</head>
<body>
  <header class="header"><a href="/" class="header-logo">
      <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
      <span class="logo-text">Minerva</span>
    </a>
    <nav class="nav-centered" id="nav-centered">
      <a href="/admin_dashboard">Dashboard</a>
      <a href="/approved-teachers.html" class="active">Teachers</a>
      <a href="/approved-students.html">Students</a>
      <a href="/matched.html">Matched</a>
    </nav>
    <div class="header-right">
      <div class="lang-wrap">
        <button class="lang-btn" id="langBtn" onclick="toggleLang()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span id="langLabel">EN</span>
        </button>
        <div class="lang-dropdown" id="langDropdown">
          <button class="lang-option active" data-lang="en" onclick="setLang('en')">EN</button>
          <button class="lang-option" data-lang="zhtw" onclick="setLang('zhtw')">繁</button>
          <button class="lang-option" data-lang="zhcn" onclick="setLang('zhcn')">简</button>
        </div>
      </div>
      <button class="btn-logout" id="logout-btn">Logout</button>
    </div>
</header>

  <main class="layout">
    <div class="page-header">
      <div>
        <h1 class="page-title">Matched Assignments</h1>
        <p class="page-subtitle">Parent-student to teacher matches</p>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <span class="count-badge" id="count-badge">Loading...</span>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">All Matches</span>
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="search-input" placeholder="Search by parent or teacher name..." oninput="handleSearch(this.value)">
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Parent / Student</th>
            <th>Match</th>
            <th>Matched Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr class="skeleton-row"><td colspan="4"><div class="skeleton" style="height:20px;width:60%;"></div></td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Match Details</h3>
        <button class="modal-close" onclick="closeModal()">&#215;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getFirestore, collection, getDocs, query, limit, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'BDQafXcXdaUex9P6P_zIWeKItBf7ZOIeKGSju3jE0L9nyA54-N7hg2cZkS97gErRNiqDqqLK8bNOck0tAN3Nq5s',
      authDomain: 'minerva-learning-a7eac.firebaseapp.com',
      projectId: 'minerva-learning-a7eac',
      storageBucket: 'minerva-learning-a7eac.appspot.com',
      messagingSenderId: '140471258134',
      appId: '1:140471258134:web:minerva-admin'
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const FIRESTORE_PROJECT = 'minerva-learning-a7eac';
    const FIRESTORE_KEY = 'BDQafXcXdaUex9P6P_zIWeKItBf7ZOIeKGSju3jE0L9nyA54-N7hg2cZkS97gErRNiqDqqLK8bNOck0tAN3Nq5s';
    const FIRESTORE_URL = `https://firestore.googleapis.com/v1/projects/${FIRESTORE_PROJECT}/databases/(default)/documents`;

    function fromFirestoreValue(v) {
      if (!v || typeof v !== 'object') return v;
      if (v.stringValue !== undefined) return v.stringValue;
      if (v.integerValue !== undefined) return String(v.integerValue);
      if (v.booleanValue !== undefined) return v.booleanValue;
      if (v.doubleValue !== undefined) return String(v.doubleValue);
      if (v.timestampValue !== undefined) return v.timestampValue;
      if (v.arrayValue && v.arrayValue.values) {
        try { return v.arrayValue.values.map(x => x.stringValue || x.integerValue || '').join(', '); } catch { return ''; }
      }
      return v;
    }

    function flattenDoc(doc) {
      const flat = { _id: doc.name.split('/').pop() };
      if (doc.fields) {
        for (const [k, v] of Object.entries(doc.fields)) {
          flat[k] = fromFirestoreValue(v);
        }
      }
      return flat;
    }

    async function loadViaRest() {
      const url = FIRESTORE_URL + '/registrations?key=' + FIRESTORE_KEY + '&pageSize=200';
      const res = await fetch(url);
      const data = await res.json();
      return (data.documents || []).map(flattenDoc);
    }

    function getName(reg) {
      if (reg.fullName && typeof reg.fullName === 'string') return reg.fullName;
      if (reg.parentName && typeof reg.parentName === 'string') return reg.parentName;
      if (reg.name && typeof reg.name === 'string') return reg.name;
      if (reg.firstName || reg.lastName) {
        const f = reg.firstName || '', l = reg.lastName || '';
        return [f, l].filter(Boolean).join(' ') || reg.email || '—';
      }
      return reg.email || '—';
    }

    function getEmail(reg) { return reg.email || '—'; }

    function formatDate(ts) {
      if (!ts) return '—';
      try { return new Date(ts).toLocaleDateString('en-HK', {day:'2-digit',month:'short',year:'numeric'}); } catch { return ts; }
    }

    function renderSubjectChips(val) {
      if (!val) return '—';
      const arr = String(val).split(',').map(s => s.trim()).filter(Boolean);
      if (!arr.length) return '—';
      return arr.map(s => `<span class="subject-chip">${s}</span>`).join(' ');
    }

    let allMatches = [];
    let searchQuery = '';

    async function loadRecords() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '<tr class="skeleton-row"><td colspan="4"><div class="skeleton" style="height:20px;width:60%;"></div></td></tr>';
      try {
        let docs = await loadViaRest();
        // Filter: matched status + parent role
        allMatches = docs.filter(r =>
          String(r.status || '').toLowerCase() === 'matched' &&
          String(r.role || '').toLowerCase() === 'parent'
        );
        allMatches.sort((a, b) => {
          const ta = a.matchedAt ? new Date(a.matchedAt).getTime() : 0;
          const tb = b.matchedAt ? new Date(b.matchedAt).getTime() : 0;
          return tb - ta;
        });
        document.getElementById('count-badge').textContent = allMatches.length + ' match' + (allMatches.length !== 1 ? 'es' : '');
        renderTable(allMatches);
      } catch (err) {
        console.error(err);
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--danger);padding:2rem;">Failed to load: ' + err.message + '</td></tr>';
      }
    }

    function renderTable(records) {
      const tbody = document.getElementById('table-body');
      if (!records.length) {
        tbody.innerHTML = '<tr><td colspan="4"><div class="no-data"><div class="no-data-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div><h3>No matches yet</h3><p>Parent-teacher matches will appear here</p></div></td></tr>';
        return;
      }
      tbody.innerHTML = records.map(r => `
        <tr>
          <td>
            <div class="td-name">${getName(r)}</div>
            <div class="td-email">${getEmail(r)}</div>
          </td>
          <td>
            <div class="td-match">
              <span class="td-role parent">Parent</span>
              <span class="match-arrow">&#8594;</span>
              <span class="td-role teacher">${r.matchedTeacherName || 'Teacher'}</span>
            </div>
          </td>
          <td class="td-time">${formatDate(r.matchedAt)}</td>
          <td><button class="btn-view" onclick="showModal('${r._id}')">View</button></td>
        </tr>
      `).join('');
    }

    window.handleSearch = function(q) {
      searchQuery = q.toLowerCase();
      const filtered = searchQuery
        ? allMatches.filter(r => getName(r).toLowerCase().includes(searchQuery) || (r.matchedTeacherName || '').toLowerCase().includes(searchQuery))
        : allMatches;
      renderTable(filtered);
    };

    window.showModal = function(id) {
      const r = allMatches.find(x => x._id === id);
      if (!r) return;
      const parentName = getName(r);
      const teacherName = r.matchedTeacherName || 'Unknown Teacher';
      const teacherId = r.matchedTeacherId || '';

      let html = `
        <div class="match-section-label">Parent / Student</div>
        <div class="match-detail-card">
          <div class="match-detail-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
          <div class="match-detail-info">
            <div class="match-detail-name">${parentName}</div>
            <div class="match-detail-meta">${getEmail(r)} · ${r.subject || r.subjects || 'General'}</div>
            <div class="match-detail-meta">Matched: ${formatDate(r.matchedAt)}</div>
          </div>
        </div>

        <div class="match-section-label">Matched Teacher</div>
        <div class="match-detail-card">
          <div class="match-detail-icon" style="background:var(--primary);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></div>
          <div class="match-detail-info">
            <div class="match-detail-name">${teacherName}</div>
            <div class="match-detail-meta">Teacher ID: ${teacherId || '—'}</div>
          </div>
        </div>

        <div style="margin-top:1rem;">
n          <div class="detail-section"><div class="detail-label">Student Name</div><div class="detail-value">${r.studentFirstName && r.studentLastName ? r.studentFirstName + ' ' + r.studentLastName : (r.studentFirstName || r.firstName || '—')}</div></div>
          <div class="detail-section"><div class="detail-label">Subject</div><div class="detail-value">${renderSubjectChips(r.subject || r.subjects)}</div></div>
          <div class="detail-section"><div class="detail-label">District</div><div class="detail-value">${r.district || '—'}</div></div>
          <div class="detail-section"><div class="detail-label">Lesson Mode</div><div class="detail-value">${r.lessonMode || '—'}</div></div>
          <div class="detail-section"><div class="detail-label">Budget</div><div class="detail-value">${r.budget || '—'}</div></div>
        </div>
      `;

      document.getElementById('modal-title').textContent = 'Match Details';
      document.getElementById('modal-body').innerHTML = html;
      document.getElementById('modal-footer').innerHTML = '<button class="btn-modal close-btn" onclick="closeModal()">Close</button>';
      document.getElementById('modal-overlay').classList.add('open');
    };

    window.closeModal = function() { document.getElementById('modal-overlay').classList.remove('open'); };
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    loadRecords();
  </script>

<script>
window.toggleLang = function() { document.getElementById('langDropdown').classList.toggle('show'); };
window.setLang = function(lang) {
  document.documentElement.lang = lang;
  document.getElementById('langLabel').textContent = lang === 'zhtw' ? '繁' : lang === 'zhcn' ? '简' : 'EN';
  localStorage.setItem('minerva_lang', lang);
  document.querySelectorAll('.lang-option').forEach(function(b) {
    b.classList.toggle('active', b.dataset.lang === lang);
    b.style.fontWeight = b.dataset.lang === lang ? '700' : '600';
  });
  var dd = document.getElementById('langDropdown');
  if (dd) dd.classList.remove('show');
};
document.addEventListener('click', function(e) {
  if (!e.target.closest('.lang-wrap')) {
    var d = document.getElementById('langDropdown');
    if (d) d.classList.remove('show');
  }
});
(function() {
  var saved = localStorage.getItem('minerva_lang');
  if (saved) { setTimeout(function() { window.setLang(saved); }, 10); }
})();
document.getElementById('logout-btn').addEventListener('click', function() {
  sessionStorage.removeItem('minerva_admin_token');
  window.location.href = '/admin_login';
});

// Highlight active nav link based on current URL
(function() {
  var path = window.location.pathname;
  var navLinks = document.querySelectorAll('.nav-centered a');
  navLinks.forEach(function(link) {
    var href = link.getAttribute('href');
    if (href === path || (href && path.endsWith(href))) {
      link.classList.add('active');
    } else {
      link.classList.remove('active');
    }
  });
})();
</script>

</body>
</html>
