<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — Minerva Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --primary: #7C3AED; --primary-light: #8B5CF6; --dark: #0F172A; --dark-2: #1E293B; --text: #334155; --text-muted: #94A3B8; --border: #E2E8F0; --surface: #F8FAFC; --surface-2: #F1F5F9; --white: #FFFFFF; --danger: #EF4444; --success: #10B981; --warning: #F59E0B; --info: #3B82F6; --orange: #F97316; --teal: #0EA5E9; --shadow: 0 1px 3px rgba(0,0,0,0.06),0 4px 16px rgba(0,0,0,0.04); --radius: 16px; }
    body { font-family: 'DM Sans', system-ui, sans-serif; background: var(--surface); color: var(--dark); -webkit-font-smoothing: antialiased; min-height: 100vh; }
    h1,h2,h3,h4{font-family:'Outfit',sans-serif;letter-spacing:-0.02em}

    /* ===== STANDARD ADMIN HEADER ===== */
    .header{background:var(--white);border-bottom:1px solid var(--border);padding:0 2rem;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .header-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
    .logo-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--primary),var(--primary-light));border-radius:8px;display:flex;align-items:center;justify-content:center}
    .logo-mark svg{width:18px;height:18px}
    .logo-text{font-family:'Outfit',sans-serif;font-weight:700;font-size:1.125rem;color:var(--dark)}
    .header-right{display:flex;align-items:center;gap:12px}
    .btn-logout{background:none;border:1.5px solid var(--border);cursor:pointer;color:var(--primary);font-size:0.8125rem;font-weight:500;font-family:'DM Sans',sans-serif;padding:5px 12px;border-radius:8px;transition:all 0.15s}
    .btn-logout:hover{border-color:var(--danger);color:var(--danger)}
    .nav-centered{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:4px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
    .nav-centered a{font-size:0.875rem;font-weight:500;color:var(--dark);text-decoration:none;padding:7px 14px;border-radius:8px;transition:background 0.15s;white-space:nowrap}
    .nav-centered a:hover{background:rgba(124,58,237,0.06);color:var(--primary)}
    .nav-centered a.active{color:var(--primary);font-weight:600}
    .lang-wrap{position:relative}
    .lang-btn{display:flex;align-items:center;gap:5px;padding:7px 10px;border:1.5px solid var(--border);border-radius:10px;background:#fff;font-size:0.8125rem;font-weight:600;color:var(--primary);cursor:pointer;font-family:'DM Sans',sans-serif}
    .lang-dropdown{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--border);border-radius:10px;padding:6px;display:none;z-index:200;min-width:80px;box-shadow:0 8px 24px rgba(0,0,0,0.08)}
    .lang-dropdown.show{display:block!important}
    .lang-option{display:block;width:100%;padding:7px 10px;border:none;background:none;border-radius:6px;font-size:0.8125rem;font-weight:600;color:var(--primary);cursor:pointer;text-align:left}
    .lang-option:hover{background:rgba(124,58,237,0.06)}
    .lang-option.active{color:var(--primary);font-weight:700}

    /* ===== LAYOUT ===== */
    .layout{max-width:720px;margin:0 auto;padding:2rem}

    /* ===== PROFILE STYLES ===== */
    .profile-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
    .profile-header{padding:1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:1rem}
    .avatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-weight:700;font-size:1.25rem;color:#fff;flex-shrink:0}
    .avatar.teacher{background:linear-gradient(135deg,#F97316,#FB923C)}
    .avatar.parent{background:linear-gradient(135deg,#3B82F6,#60A5FA)}
    .profile-info{flex:1;min-width:0}
    .profile-name{font-family:'Outfit',sans-serif;font-size:1.125rem;font-weight:700;color:var(--dark);margin-bottom:2px}
    .profile-meta{font-size:0.875rem;color:var(--text-muted)}
    .profile-badges{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
    .badge{padding:3px 10px;border-radius:20px;font-size:0.75rem;font-weight:600}
    .badge.teacher{background:rgba(249,115,22,0.1);color:var(--orange)}
    .badge.parent{background:rgba(59,130,246,0.1);color:var(--info)}
    .badge.pending{background:rgba(245,158,11,0.1);color:var(--warning)}
    .badge.approved{background:rgba(16,185,129,0.1);color:var(--success)}
    .badge.rejected{background:rgba(239,68,68,0.1);color:var(--danger)}
    .badge.matched{background:rgba(124,58,237,0.1);color:var(--primary)}
    .profile-body{padding:1.5rem}
    .section{margin-bottom:1.5rem}
    .section:last-child{margin-bottom:0}
    .section-title{font-size:0.6875rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.875rem;padding-bottom:6px;border-bottom:1px solid var(--border)}
    .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.875rem}
    .field.full{grid-column:1/-1}
    .field-label{font-size:0.75rem;font-weight:600;color:var(--text-muted);margin-bottom:3px}
    .field-value{font-size:0.9375rem;color:var(--dark);font-weight:500;word-break:break-word}
    .field-value.empty{color:var(--text-muted);font-style:italic}
    .field-value a{color:var(--primary);text-decoration:none}
    .field-value a:hover{text-decoration:underline}
    .chip-list{display:flex;flex-wrap:wrap;gap:4px}
    .chip{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:0.8125rem;color:var(--text)}
    .loading{text-align:center;padding:3rem;color:var(--text-muted)}
    .loading-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1rem}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error-msg{text-align:center;padding:3rem;color:var(--danger)}
    .actions{padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;gap:0.75rem;flex-wrap:wrap}
    .btn{padding:9px 18px;border-radius:8px;font-size:0.875rem;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all 0.15s;text-decoration:none;display:inline-flex;align-items:center}
    .btn-secondary{background:var(--surface-2);color:var(--text);border:1.5px solid var(--border)}
    .btn-secondary:hover{background:var(--border);color:var(--dark)}
    .match-info{background:rgba(124,58,237,0.05);border:1px solid rgba(124,58,237,0.15);border-radius:10px;padding:0.875rem 1rem;margin-top:1rem}
    .match-info-label{font-size:0.75rem;font-weight:600;color:var(--primary);margin-bottom:4px}
    .match-info-value{font-size:0.9375rem;color:var(--dark);font-weight:500}
  </style>
</head>
<body>
  <header class="header">
    <a href="/" class="header-logo">
      <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
      <span class="logo-text">Minerva</span>
    </a>
    <nav class="nav-centered" id="nav-centered">
      <a href="/admin_dashboard" data-i18n="admin_nav_dashboard">Dashboard</a>
      <a href="/approved-teachers.html" data-i18n="admin_nav_teachers">Teachers</a>
      <a href="/approved-students.html" data-i18n="admin_nav_students">Students</a>
      <a href="/matched.html" data-i18n="admin_nav_matched">Matched</a>
    </nav>
    <div class="header-right">
      <div class="lang-wrap">
        <button class="lang-btn" id="langBtn" onclick="toggleLang()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span id="langLabel">EN</span>
        </button>
        <div class="lang-dropdown" id="langDropdown">
          <button class="lang-option active" data-lang="en" onclick="setLang('en')">EN</button>
          <button class="lang-option" data-lang="zhtw" onclick="setLang('zhtw')">繁</button>
          <button class="lang-option" data-lang="zhcn" onclick="setLang('zhcn')">简</button>
        </div>
      </div>
      <button class="btn-logout" id="logout-btn"data-i18n="admin_logout"data-i18n="admin_logout">Logout</button>
    </div>
  </header>

  <main class="layout">
    <div id="content">
      <div class="loading">
        <div class="loading-spinner"></div>
        <divdata-i18n="admin_profile_load">Loading profile...</div>
      </div>
    </div>
  </main>

<script src="/i18n.js" defer></script>
<script>
window.toggleLang = function() { document.getElementById('langDropdown').classList.toggle('show'); };
window.setLang = function(lang) {
  document.documentElement.lang = lang;
  document.getElementById('langLabel').textContent = lang === 'zhtw' ? '繁' : lang === 'zhcn' ? '简' : 'EN';
  localStorage.setItem('minerva_lang', lang);
  document.querySelectorAll('.lang-option').forEach(function(b) {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  document.getElementById('langDropdown').classList.remove('show');
  if (window.T) window.apply();
};
document.addEventListener('click', function(e) {
  if (!e.target.closest('.lang-wrap')) {
    document.getElementById('langDropdown').classList.remove('show');
  }
});
(function() {
  var saved = localStorage.getItem('minerva_lang');
  if (saved) setTimeout(function() { window.setLang(saved); }, 10);
})();
document.getElementById('logout-btn').addEventListener('click', function() {
  sessionStorage.removeItem('minerva_admin_token');
  window.location.href = '/admin_login';
});
// Highlight active nav link
document.addEventListener('DOMContentLoaded', function() {
  var path = window.location.pathname;
  var norm = path.replace(/\.html?$/, '');
  var navLinks = document.querySelectorAll('.nav-centered a');
  navLinks.forEach(function(link) {
    var href = link.getAttribute('href').replace(/\.html?$/, '');
    if (href === norm || norm.endsWith(href) || href === path) {
      link.classList.add('active');
    } else {
      link.classList.remove('active');
    }
  });
});
document.addEventListener('DOMContentLoaded', window.apply);
</script>
<script type="module">
const FIRESTORE_KEY = 'BDQafXcXdaUex9P6P_zIWeKItBf7ZOIeKGSju3jE0L9nyA54-N7hg2cZkS97gErRNiqDqqLK8bNOck0tAN3Nq5s';
const FIRESTORE_PROJECT = 'minerva-learning-a7eac';
const FIRESTORE_URL = 'https://firestore.googleapis.com/v1/projects/' + FIRESTORE_PROJECT + '/databases/(default)/documents';

function fromFirestoreValue(v) {
  if (!v || typeof v !== 'object') return v;
  if (v.stringValue !== undefined) return v.stringValue;
  if (v.integerValue !== undefined) return String(v.integerValue);
  if (v.booleanValue !== undefined) return v.booleanValue;
  if (v.doubleValue !== undefined) return String(v.doubleValue);
  if (v.timestampValue !== undefined) return v.timestampValue;
  if (v.arrayValue && v.arrayValue.values) {
    try { return v.arrayValue.values.map(function(x) { return x.stringValue || x.integerValue || ''; }).join(', '); } catch(e) { return ''; }
  }
  return v;
}

function flattenDoc(doc) {
  var flat = { _id: doc.name.split('/').pop() };
  if (doc.fields) {
    Object.keys(doc.fields).forEach(function(k) { flat[k] = fromFirestoreValue(doc.fields[k]); });
  }
  return flat;
}

async function loadProfile(id) {
  var res = await fetch(FIRESTORE_URL + '/registrations/' + id + '?key=' + FIRESTORE_KEY);
  if (!res.ok) return null;
  var data = await res.json();
  return flattenDoc(data);
}

function getName(r) { return r.fullName || r.parentName || r.name || r.email || '—'; }
function getEmail(r) { return r.email || r.whatsapp || r.phone || '—'; }
function getInitials(name) {
  var parts = String(name).split(' ');
  if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  return String(name).substring(0, 2).toUpperCase();
}

function formatDate(ts) {
  if (!ts) return '—';
  try { return new Date(ts).toLocaleDateString('en-HK', { day: '2-digit', month: 'short', year: 'numeric' }); } catch(e) { return ts; }
}

function renderChips(val) {
  if (!val) return '<span class="field-value empty">—</span>';
  var items = String(val).split('|').map(function(s) { return s.trim(); }).filter(Boolean);
  if (items.length === 0) return '<span class="field-value empty">—</span>';
  return '<div class="chip-list">' + items.map(function(i) { return '<span class="chip">' + i + '</span>'; }).join('') + '</div>';
}

function renderField(label, value, isLink) {
  if (value === undefined || value === null || value === '') {
    return '<div class="field"><div class="field-label">' + label + '</div><div class="field-value empty">—</div></div>';
  }
  if (isLink) {
    return '<div class="field"><div class="field-label">' + label + '</div><div class="field-value"><a href="' + value + '" target="_blank">View ↗</a></div></div>';
  }
  return '<div class="field"><div class="field-label">' + label + '</div><div class="field-value">' + value + '</div></div>';
}

function renderProfile(r) {
  var role = String(r.role || '').toLowerCase();
  var status = String(r.status || 'pending');
  var name = getName(r);
  var initials = getInitials(name);
  var isTeacher = role === 'teacher';

  var sections = [];

  sections.push({ section: (window.T.admin_contact?.[window.lang] || 'Contact'), items: [
    { label: (window.T.admin_full_name?.[window.lang] || 'Full Name'), value: name },
    { label: (window.T.admin_email?.[window.lang] || 'Email'), value: r.email },
    { label: (window.T.admin_phone?.[window.lang] || 'Phone / WhatsApp'), value: r.whatsapp || r.phone },
    { label: (window.T.admin_submitted?.[window.lang] || 'Submitted'), value: formatDate(r.submittedAt) },
  ]});

  if (isTeacher) {
    sections.push({ section: (window.T.admin_teaching_profile?.[window.lang] || 'Teaching Profile'), items: [
      { label: (window.T.admin_bio?.[window.lang] || 'Bio'), value: r.bio },
      { label: (window.T.admin_experience?.[window.lang] || 'Experience'), value: r.yearsExperience || r.experience },
      { label: (window.T.admin_qualification?.[window.lang] || 'Qualification'), value: r.qualification },
      { label: (window.T.admin_hourly_rate?.[window.lang] || 'Hourly Rate'), value: r.hourlyRate ? 'HK$' + r.hourlyRate + '/hr' : null },
      { label: (window.T.admin_age_groups?.[window.lang] || 'Student Age Groups'), value: r.ageGroups || r.studentAgeGroups },
      { label: (window.T.admin_exam_systems?.[window.lang] || 'Exam Systems'), value: r.examSystems },
      { label: (window.T.admin_availability?.[window.lang] || 'Availability'), value: r.availability },
    ]});
    sections.push({ section: (window.T.admin_subjects_location?.[window.lang] || 'Subjects & Location'), items: [
      { label: (window.T.admin_subjects?.[window.lang] || 'Subject'), value: r.subjects || r.subject, isChip: true },
      { label: (window.T.admin_other_subjects?.[window.lang] || 'Other Subjects'), value: r.otherSubjects },
      { label: (window.T.admin_district?.[window.lang] || 'District'), value: r.district },
      { label: (window.T.admin_travel?.[window.lang] || 'Travel Distance'), value: r.travelDistance },
      { label: (window.T.admin_lesson_mode?.[window.lang] || 'Lesson Mode'), value: r.lessonMode },
      { label: (window.T.admin_lesson_duration?.[window.lang] || 'Lesson Duration'), value: r.lessonDuration },
    ]});
    sections.push({ section: (window.T.admin_verification?.[window.lang] || 'Verification'), items: [
      { label: (window.T.admin_certificate?.[window.lang] || 'Certificate'), value: r.certUrl, isLink: !!r.certUrl, raw: r.certUrl },
      { label: (window.T.admin_video?.[window.lang] || 'Intro Video'), value: r.introVideoUrl, isLink: !!r.introVideoUrl, raw: r.introVideoUrl },
      { label: (window.T.admin_total_matches?.[window.lang] || 'Total Matches'), value: r.totalMatches || 0 },
      { label: (window.T.admin_free_matches_left?.[window.lang] || 'Free Matches Left'), value: r.freeMatchesRemaining !== undefined ? r.freeMatchesRemaining + (window.T.admin_free_remaining?.[window.lang] || ' remaining') : null },
      { label: (window.T.admin_referral?.[window.lang] || 'Referral Source'), value: r.source },
    ]});
  } else {
    sections.push({ section: (window.T.admin_student_info?.[window.lang] || 'Student Info'), items: [
      { label: (window.T.admin_student_name?.[window.lang] || 'Student Name'), value: r.studentFirstName && r.studentLastName ? r.studentFirstName + ' ' + r.studentLastName : (r.studentFirstName || r.firstName || '—') },
      { label: (window.T.admin_year_form?.[window.lang] || 'Year / Form'), value: r.studentLevel },
      { label: (window.T.admin_school_type?.[window.lang] || 'School Type'), value: r.schoolType },
      { label: (window.T.admin_student_gender?.[window.lang] || 'Student Gender'), value: r.studentGender },
      { label: (window.T.admin_student_school?.[window.lang] || 'Student School'), value: r.studentSchool },
    ]});
    sections.push({ section: (window.T.admin_learning_needs?.[window.lang] || 'Learning Needs'), items: [
      { label: 'Subject', value: r.subjects || r.subject, isChip: true },
      { label: (window.T.admin_current_level?.[window.lang] || 'Current Level'), value: r.currentLevel },
      { label: (window.T.admin_target_exam?.[window.lang] || 'Target Exam'), value: r.targetExam },
      { label: (window.T.admin_learning_goal?.[window.lang] || 'Learning Goal'), value: r.learningGoal },
      { label: (window.T.admin_teacher_gender?.[window.lang] || 'Preferred Teacher Gender'), value: r.teacherGender },
    ]});
    sections.push({ section: (window.T.admin_logistics?.[window.lang] || 'Logistics'), items: [
      { label: 'District', value: r.district },
      { label: 'Lesson Mode', value: r.lessonMode },
      { label: 'Lesson Frequency', value: r.lessonFrequency },
      { label: 'Lesson Duration', value: r.lessonDuration },
      { label: (window.T.admin_budget?.[window.lang] || 'Budget'), value: r.budget },
      { label: (window.T.admin_start?.[window.lang] || 'When to Start'), value: r.startDate },
    ]});
    if (r.notes) {
      sections.push({ section: 'Additional Info', items: [
        { label: (window.T.admin_notes?.[window.lang] || 'Notes'), value: r.notes, full: true },
      ]});
    }
  }

  if (r.matchedTeacherName) {
    sections.push({ section: (window.T.admin_match_info?.[window.lang] || 'Match Info'), items: [
      { label: (window.T.admin_matched_with_label?.[window.lang] || 'Matched With'), value: r.matchedTeacherName },
      { label: (window.T.admin_match_date_label?.[window.lang] || 'Match Date'), value: formatDate(r.matchedAt) },
    ]});
  }

  var html = '<div class="profile-card"><div class="profile-header"><div class="avatar ' + role + '">' + initials + '</div><div class="profile-info"><div class="profile-name">' + name + '</div><div class="profile-meta">' + getEmail(r) + '</div><div class="profile-badges"><span class="badge ' + role + '">' + (isTeacher ? (window.T.admin_teacher_role?.[window.lang] || 'Teacher') : (window.T.admin_parent_student?.[window.lang] || 'Parent / Student')) + '</span><span class="badge ' + status + '">' + (window.T['admin_status_' + status]?.[window.lang] || status) + '</span></div></div></div><div class="profile-body">';

  sections.forEach(function(s) {
    var items = s.items.filter(function(f) { return f.value !== null && f.value !== undefined && f.value !== ''; });
    if (items.length === 0) return;
    html += '<div class="section"><div class="section-title">' + s.section + '</div><div class="field-grid">';
    items.forEach(function(f) {
      if (f.isChip) {
        html += '<div class="field"><div class="field-label">' + f.label + '</div>' + renderChips(f.value) + '</div>';
      } else if (f.isLink) {
        html += renderField(f.label, f.raw, true);
      } else if (f.full) {
        html += '<div class="field full"><div class="field-label">' + f.label + '</div><div class="field-value" style="white-space:pre-wrap">' + f.value + '</div></div>';
      } else {
        html += renderField(f.label, f.value);
      }
    });
    html += '</div></div>';
  });

  if (r.matchedTeacherName) {
    html += '<div class="match-info"><div class="match-info-label">' + (window.T.admin_matched_teacher_label?.[window.lang] || 'Matched Teacher') + '</div><div class="match-info-value">' + r.matchedTeacherName + '</div></div>';
  }

  html += '</div><div class="actions"><a href="/admin_dashboard" class="btn btn-secondary"data-i18n="admin_back_dashboard">← Back to Dashboard</a></div></div>';
  return html;
}

var params = new URLSearchParams(window.location.search);
var id = params.get('id');
if (!id) {
  document.getElementById('content').innerHTML = '<div class="error-msg">' + (window.T.admin_profile_noId?.[window.lang] || 'No profile ID provided.') + ' <a href="/admin_dashboard">' + (window.T.admin_back_dashboard?.[window.lang] || 'Go back') + '</a></div>';
} else {
  loadProfile(id).then(function(r) {
    if (!r) {
      document.getElementById('content').innerHTML = '<div class="error-msg">' + (window.T.admin_profile_notFound?.[window.lang] || 'Profile not found.') + ' <a href="/admin_dashboard">' + (window.T.admin_back_dashboard?.[window.lang] || 'Go back') + '</a></div>';
      return;
    }
    document.getElementById('content').innerHTML = renderProfile(r);
    document.title = getName(r) + ' — Minerva Admin';
  }).catch(function() {
    document.getElementById('content').innerHTML = '<div class="error-msg">' + (window.T.admin_profile_failed?.[window.lang] || 'Failed to load profile.') + ' <a href="/admin_dashboard">' + (window.T.admin_back_dashboard?.[window.lang] || 'Go back') + '</a></div>';
  });
}
</script>
